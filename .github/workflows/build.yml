name: Build FakeTrueTone Rootless .deb

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install System Dependencies & Theos
        run: |
          sudo apt-get update -y
          sudo apt-get install -y build-essential fakeroot libtinfo5 git curl zstd
          git clone --recursive https://github.com/theos/theos.git ~/theos
          
          # Install Linux iOS cross-toolchain
          curl -LO https://github.com/sbingner/llvm-project/releases/download/v10.0.0-1/linux-ios-arm64-toolchain.tar.xz
          mkdir -p ~/theos/toolchain/linux/iphone
          tar -xf linux-ios-arm64-toolchain.tar.xz -C ~/theos/toolchain/linux/iphone
          
          # Install iOS 16.5 SDK
          curl -LO https://github.com/theos/sdks/releases/download/latest/iPhoneOS16.5.sdk.tar.xz
          tar -xf iPhoneOS16.5.sdk.tar.xz -C ~/theos/sdks/

      - name: Compile Rootless .deb
        env:
          THEOS: /home/runner/theos
        run: |
          make clean
          make package THEOS_PACKAGE_SCHEME=rootless FINALPACKAGE=1

      - name: Deploy .deb to Repository Root
        run: |
          cp packages/*.deb ./com.developer.faketruetone_1.0.0_iphoneos-arm64.deb
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add com.developer.faketruetone_1.0.0_iphoneos-arm64.deb
          git commit -m "chore: auto-compile arm64 FakeTrueTone rootless dylib" || echo "No changes to commit"
          git push origin main
